[project]
name = "studypath-eu"
version = "0.1.0"
description = "AI study-abroad platform for Bangladeshi students targeting Hungary, Germany, and Italy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.4.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0.43",
    "uvicorn[standard]>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
